name: Publish to npm

on:
  # Merging to main never publishes. Pushing a v* tag does, and `npm version`
  # is what creates those tags. Releasing stays a separate, deliberate act.
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# Publishing is irreversible, so never let two runs race each other.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC). This is what authenticates to
  # npm: there is no token stored anywhere in this repository.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # `npm version` writes package.json and cuts the tag in one operation, so
      # these cannot disagree. If they do, the tag was made by hand: stop,
      # rather than publish a version nobody meant to ship.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")

          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Nothing published."
            exit 1
          fi

          echo "Publishing $(node -p "require('./package.json').name")@$PKG" >> "$GITHUB_STEP_SUMMARY"

      # Node 22 ships npm 10.x; Trusted Publishing needs npm >= 11.5.1.
      - name: Use an npm that supports Trusted Publishing
        run: npm install -g npm@latest

      - run: npm ci

      # prepublishOnly runs lint, typecheck, test and build, so a broken build
      # cannot reach the registry. --provenance is implied by Trusted
      # Publishing; it is spelled out here to keep the intent obvious.
      - run: npm publish --provenance --access public
